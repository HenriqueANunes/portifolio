services:
  nginx-site:
    image: nginx:alpine
    container_name: nginx-site
    volumes:
      - ./html:/usr/share/nginx/html:ro
    configs:
      - source: nginx_conf
        target: /etc/nginx/conf.d/default.conf
    restart: unless-stopped
    networks:
      - homelab

configs:
  nginx_conf:
    file: ./nginx.conf

networks:
  homelab:
    external: true